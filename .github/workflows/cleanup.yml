name: Daily Firebase Cleanup

on:
  schedule:
    # 0 21 يعني الدقيقة 0 والساعة 21 (9 مساءً) بتوقيت جرينتش، وهو ما يوافق 12:00 منتصف الليل بتوقيت مصر
    - cron: '0 21 * * *'
  # يتيح لك تشغيل السكريبت يدوياً في أي وقت للتجربة
  workflow_dispatch: 

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Run Cleanup Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cleanup.js
