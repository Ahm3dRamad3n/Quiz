<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم العقوبات | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4"
  >
    <button
      onclick="window.location.href = 'index.html'"
      class="absolute top-4 right-4 bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg transition shadow-lg shadow-gray-700/20"
    >
      العودة للصفحة الرئيسية
    </button>
    <div
      class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-6 space-y-6"
    >
      <div class="text-center space-y-2">
        <h1 class="text-2xl font-bold text-indigo-400">
          إدارة العقوبات والحظر
        </h1>
        <p class="text-sm text-gray-400">
          تحكم في المستخدمين وعناوين الـ IP المحظورة
        </p>
      </div>

      <div
        class="bg-red-900/40 border-r-4 border-red-600 p-4 rounded-l-lg shadow-inner"
      >
        <div class="flex items-start">
          <span class="text-2xl ml-3">⚠️</span>
          <div>
            <h3 class="text-red-400 font-bold text-lg">تحذير أمني صارم!</h3>
            <p class="text-red-300 text-sm mt-1 leading-relaxed">
              هذه الصفحة مخصصة لمديري النظام (Admins) فقط. إذا لم تكن تمتلك
              صلاحيات الإدارة، <strong>فلا تحاول تنفيذ أي إجراء هنا</strong>،
              لأن نظام الحماية سيقوم بحظر حسابك وجهازك (IP) بشكل فوري وتلقائي!
            </p>
          </div>
        </div>
      </div>

      <div
        id="auth-status"
        class="bg-gray-750 p-3 rounded-lg border border-yellow-600/30 text-center text-sm text-yellow-500"
      >
        جاري التحقق من الصلاحيات...
      </div>

      <div id="admin-controls" class="hidden space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2"
            >معرّف المستخدم (User ID) أو عنوان الـ IP</label
          >
          <input
            type="text"
            id="target-value"
            required
            placeholder="أدخل الـ IP أو الـ ID هنا..."
            class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition text-left dir-ltr"
          />
        </div>

        <div class="flex gap-3">
          <button
            id="btn-unban"
            data-action="unban"
            class="action-btn flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-green-600/20"
          >
            فك الحظر نهائياً
          </button>
          <button
            id="btn-reduce"
            data-action="reduce"
            class="action-btn flex-1 bg-yellow-600 hover:bg-yellow-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-yellow-600/20"
          >
            تخفيف العقوبة
          </button>
        </div>
      </div>

      <div
        id="result-message"
        class="hidden p-4 rounded-xl text-sm text-center font-medium transition-all"
      ></div>
    </div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
