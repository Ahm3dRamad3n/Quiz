<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع تحت الصيانة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            /* خلفية متدرجة زرقاء شيك */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            overflow: hidden;
        }

        .maintenance-card {
            /* تأثير الزجاج الحديث */
            background: rgba(255, 255, 255, 0.1);
            padding: 50px 70px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 90%;
            animation: fadeIn 1s ease-in-out;
        }

        .icon {
            font-size: 65px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 38px;
            margin: 0 0 15px 0;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 20px;
            line-height: 1.8;
            margin: 0;
            opacity: 0.9;
        }

        /* شكل دايرة تحميل بتلف */
        .loader {
            margin-top: 35px;
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        /* أنيميشن */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        /* تظبيط الموبايل */
        @media (max-width: 600px) {
            .maintenance-card { padding: 30px 20px; }
            h1 { font-size: 28px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon">🚧 🛠️</div>
        <h1>الموقع مغلق للصيانة</h1>
        <p>شغالين دلوقتي على تحديثات أمنية مهمة وتطوير في قواعد البيانات.<br>هنرجع أقوى وأسرع في أقرب وقت.. شكراً لانتظاركم!</p>
        <div class="loader"></div>
    </div>

</body>
</html>
