<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

/* خلفية نجوم */
.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  background: transparent;
}

.stars::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  box-shadow:
    100px 200px white, 200px 300px white, 300px 100px white,
    400px 250px white, 500px 150px white, 600px 350px white,
    700px 200px white, 800px 100px white;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

.container {
  text-align: center;
  z-index: 2;
  animation: fadeUp 1.2s ease;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 3rem;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #00f2fe, #4facfe);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

p {
  margin-top: 15px;
  font-size: 1.2rem;
  opacity: 0.8;
}

/* Loader */
.loader {
  margin: 30px auto;
  width: 60px;
  height: 60px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top: 4px solid #00f2fe;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* زر */
.btn {
  margin-top: 15px;
  padding: 10px 25px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(90deg, #00f2fe, #4facfe);
  color: #000;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
}

/* أنيميشن */
@keyframes spin {
  100% { transform: rotate(360deg); }
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.footer {
  margin-top: 20px;
  font-size: 0.9rem;
  opacity: 0.6;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
  <h1>🚀 Coming Soon</h1>
  <p>
    The website is currently under maintenance.<br>
    We're upgrading everything to bring you something amazing.
  </p>

  <div class="loader"></div>

  <button class="btn" onclick="location.reload()">Refresh</button>

  <div class="footer">
    We’ll be back very soon 🔥
  </div>
</div>

</body>
</html>
